<style>
  :root{color-scheme:dark;--bg:#070e18;--panel:#0e1828;--panel2:#16233a;--line:#23385c;--txt:#eef4fb;--muted:#93a6c4;--accent:#18c99e;--bar:#050b14;--noteTxt:#e7effb;--onAccent:#03151f}
  :root[data-theme="light"]{color-scheme:light;--bg:#eef4f9;--panel:#ffffff;--panel2:#e3eef7;--line:#c7dbea;--txt:#0d1b2e;--muted:#5a7591;--accent:#0a7a67;--bar:#e2ecf5;--noteTxt:#22384f;--onAccent:#ffffff}
  *{box-sizing:border-box}
  html,body{overflow-x:clip}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.65}
  header.lp-site{background:linear-gradient(180deg,var(--panel2),var(--bar) 150%);border-bottom:1px solid rgba(33,205,160,.10);box-shadow:0 8px 26px rgba(0,0,0,.24)}
  .lp-htop{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px}
  .lp-htop img{height:40px;width:auto;display:block}
  .lp-nav{display:flex;flex-wrap:wrap;gap:6px;max-width:980px;margin:0 auto;padding:0 20px 12px}
  .lp-nav a{color:var(--txt);text-decoration:none;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
  .lp-nav a:hover,.lp-nav a[aria-current]{border-color:var(--accent);color:var(--accent)}
  .themebtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;font-size:16px}
  main{max-width:720px;margin:0 auto;padding:32px 20px 70px}
  a{color:var(--accent)}
  h1{font-size:26px;margin:0 0 6px}
  .updated{color:var(--muted);font-size:13px;margin-bottom:32px}
  h2{font-size:18px;margin:34px 0 10px;color:var(--accent)}
  p,li{color:var(--txt);font-size:15px}
  ul{padding-inline-start:22px}
  li{margin-bottom:6px}
  .back{display:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:20px 0}
  .lead{font-size:17px;color:var(--noteTxt);line-height:1.6}
  footer.lp-foot{text-align:center;padding:30px 15px 24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
  footer.lp-foot a{color:var(--muted);text-decoration:none}
  main{max-width:860px!important}
  .tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:22px 0}
  .tier{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .tier.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .tier h3{margin:0 0 4px;font-size:17px}.price{font-size:30px;font-weight:800;margin:6px 0}.price small{font-size:14px;color:var(--muted);font-weight:500}
  .tier ul{padding-left:18px;margin:10px 0 16px}.tag{display:inline-block;font-size:11px;font-weight:700;background:var(--accent);color:var(--onAccent);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
  .buy{display:block;text-align:center;background:var(--accent);color:var(--onAccent);font-weight:700;text-decoration:none;border-radius:10px;padding:11px;border:0;width:100%;font-size:15px;cursor:pointer}
  .buy[aria-disabled=true]{opacity:.55;cursor:not-allowed}
  .packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .pk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.pk b{display:block}.pk .buy{padding:8px;font-size:14px;margin-top:8px}
  input[type=text]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-family:monospace;font-size:13px}
  .key{word-break:break-all;font-family:monospace;font-size:12px;background:var(--panel2);padding:10px;border-radius:8px}
</style>
<script>(function(){try{var t=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>

<script src="/pro-config.js"></script>
<script>
const LIC="lp_pro_license";
function lpStore(k){ try{ localStorage.setItem(LIC,k); localStorage.setItem("lp_pro_checked",Date.now()); }catch(e){} }
function lpDl(list){ return (list||[]).map(d=>`<li><a href="${d.url}">${d.title||d.city+" Phrase Pack"} (PDF)</a> <span style="color:var(--muted);font-size:13px">— link valid 48 h; restore any time for a new one</span></li>`).join(""); }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const sid=new URLSearchParams(location.search).get("session_id")||"", out=document.getElementById("out");
async function go(n){ try{ const r=await fetch("/.netlify/functions/license?session_id="+encodeURIComponent(sid)); const j=await r.json().catch(()=>({}));
  if((r.status===202||r.status===502)&&n<20) return setTimeout(()=>go(n+1),2500);
  if(!r.ok) throw new Error(j.error||"We couldn't confirm this purchase yet.");
  lpStore(j.license);
  out.innerHTML=`<p class="lead">Your purchase is active in this browser${j.email?" (receipt sent to "+esc(j.email)+")":""}.</p>${j.kind==="pro"?"<p>✓ <b>Pro</b> is on: ads are off, offline download and CSV export are in Settings, and you have 100 AI turns a day.</p>":""}${(j.downloads||[]).length?"<h2>Your phrase packs</h2><ul>"+lpDl(j.downloads)+"</ul>":""}<h2>Your licence key</h2><p>Save it somewhere safe — paste it on <a href="/pro-restore.html">Restore purchase</a> on any device.</p><div class="key">${esc(j.license)}</div><p><a href="/">← Back to learning</a></p>`;
 }catch(e){ out.innerHTML="<p>"+esc(e.message)+"</p><p>If you were charged, don't worry — refresh in a minute, or <a href='/contact.html'>contact us</a> with your Stripe receipt.</p>"; } }
if(/^cs_(test|live)_/.test(sid)) go(0); else out.innerHTML="<p>No checkout session found. Already bought? <a href='/pro-restore.html'>Restore your purchase</a>.</p>";
</script>
</body>
