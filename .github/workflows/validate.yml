# Regression guard: prevents the TTS-code-as-route bug and sitemap drift from returning.
#   - validates every sitemap URL maps to a real language code / content route
#   - ensures the inline app script still parses
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Noindex routes (join/request/admin)
        run: node tools/check-noindex-routes.js
      - name: No client-side secrets
        run: node tools/check-no-secrets.js
      - name: Travelpayouts affiliate guard
        run: node tools/check-affiliates.js
      - name: Install deps
        run: npm ci || npm install
      - name: Build site (sitemap validator checks dist/)
        run: npm run build
      - name: Sitemap + language-code validator
        run: node tools/validate-sitemap.js
      - name: Inline app script parses
        run: |
          node -e '
          const fs=require("fs");
          const h=fs.readFileSync("index.html","utf8");
          const s=h.match(/<script>([\s\S]*?)<\/script>/g);
          const main=s[s.length-1].replace(/^<script>/,"").replace(/<\/script>$/,"");
          new Function(main);
          console.log("MAIN SCRIPT OK");
          '
